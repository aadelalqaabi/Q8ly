<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0; padding: 0;
      width: 1080px; height: 1080px;
      overflow: hidden;
      background: #0033A0;
      font-family: -apple-system, 'SF Pro Display', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    /* Corner brackets */
    .corner {
      position: absolute;
      width: 48px;
      height: 48px;
      border-color: #CBA052;
      border-style: solid;
      border-width: 0;
    }
    .corner.tl { top: 60px; left: 60px; border-top-width: 3px; border-left-width: 3px; }
    .corner.tr { top: 60px; right: 60px; border-top-width: 3px; border-right-width: 3px; }
    .corner.bl { bottom: 60px; left: 60px; border-bottom-width: 3px; border-left-width: 3px; }
    .corner.br { bottom: 60px; right: 60px; border-bottom-width: 3px; border-right-width: 3px; }

    .logo {
      margin-bottom: 80px;
    }

    .headline {
      color: #FFFFFF;
      font-size: 82px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: -0.02em;
      direction: rtl;
      margin: 0;
      padding: 0 100px;
    }

    .gold-line {
      width: 120px;
      height: 3px;
      background: #CBA052;
      margin: 50px auto;
    }

    .sub {
      color: rgba(255,255,255,0.85);
      font-size: 36px;
      font-weight: 400;
      direction: rtl;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .cta {
      margin-top: 60px;
      border: 2px solid #FFFFFF;
      border-radius: 100px;
      padding: 20px 64px;
      color: #FFFFFF;
      font-size: 32px;
      font-weight: 700;
      direction: rtl;
      letter-spacing: -0.01em;
    }

    .url {
      position: absolute;
      bottom: 80px;
      color: rgba(255,255,255,0.5);
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Logo -->
  <div class="logo">
    <svg width="220" height="88" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="top-half"><rect x="0" y="0" width="300" height="57"/></clipPath>
        <clipPath id="bot-half"><rect x="0" y="63" width="300" height="57"/></clipPath>
      </defs>
      <text x="150" y="57" text-anchor="middle" font-family="-apple-system,'SF Pro Display',sans-serif"
            font-weight="900" font-size="72" letter-spacing="-3" fill="rgba(255,255,255,0.3)" clip-path="url(#top-half)">KUWAI</text>
      <text x="150" y="57" text-anchor="middle" font-family="-apple-system,'SF Pro Display',sans-serif"
            font-weight="900" font-size="72" letter-spacing="-3" fill="#FFFFFF" clip-path="url(#bot-half)">KUWAI</text>
      <rect x="0" y="59" width="300" height="2" fill="#CBA052"/>
    </svg>
  </div>

  <!-- Arabic headline -->
  <p class="headline">بالدعوة بس.</p>

  <div class="gold-line"></div>

  <!-- Subtext -->
  <p class="sub">سجّل بقائمة الانتظار وتأمن مكانك</p>

  <!-- CTA pill -->
  <div class="cta">انضم لقائمة الانتظار</div>

  <!-- URL -->
  <span class="url">KUWAI.APP</span>

</body>
</html>
